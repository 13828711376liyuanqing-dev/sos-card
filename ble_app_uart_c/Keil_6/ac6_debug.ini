/**
**********************************************************************
* GR55xx debugger loading script for the Keil Arm Compiler 6 firmware.
*
* Load this project's AXF so source level debugging matches its AC6 HEX.
**********************************************************************
*/

// Reset the core and peripherals using the reset option selected in Keil.
RESET

// Load the active Keil target image.
LOAD %L

// Set the initial stack pointer and program counter from the vector table.
SP = _RDWORD(0x00000000)
$ = _RDWORD(0x00000004)

// Remap the vector table to address zero.
_WDWORD(0xE000ED08, 0x00000000)
